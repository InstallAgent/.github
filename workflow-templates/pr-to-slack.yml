name: PR → Slack (approve / close)

# Posts every new PR to Slack (as @Agent Zero) with "Merge" and "Close"
# buttons. This workflow only POSTS (it is read-only). The button clicks are
# handled by @Agent Zero itself — team-tools/apps/slack-agent, Bolt Socket
# Mode, the `pr_merge`/`pr_close` action handlers in src/app.ts — which
# squash-merges (or closes) via the GitHub API using its own write-scoped
# token. Only an authorized Install Agent team member's click is honored
# (same permission check the bot uses everywhere else). The button's `value`
# carries the owner/repo + PR number as JSON, so this workflow stays
# repo-agnostic — no regex over the posted message, no per-repo config.
#
# Required secrets (both ORGANIZATION secrets, visibility "all repositories",
# set once so every current and future repo is covered with no per-repo
# setup — a repo-level secret of the same name also works and takes
# precedence):
#   SLACK_PR_BOT_TOKEN    — @Agent Zero's Slack bot token (xoxb-), needs the
#                           chat:write scope. Same token value as the
#                           slack-agent deploy's SLACK_BOT_TOKEN
#                           (team-infra/agent-hosting) — Agent Zero's Socket
#                           Mode connection is what receives the button
#                           clicks, so the posting identity and the
#                           interactivity receiver have to be the same app.
#   SLACK_PR_CHANNEL_ID   — the Slack channel ID (#notify-prs) to post into.
#
# If either secret is absent the job logs a notice and exits green, so this
# file is safe to land in a repo before the secrets exist.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    # Drafts are not ready to review, and skipping them also stops the
    # duplicate post a draft would otherwise make on opened + ready_for_review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Post PR to Slack with action buttons
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_PR_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_PR_CHANNEL_ID }}
          PR_REPO: ${{ github.event.repository.name }}
          PR_REPO_FULL: ${{ github.event.repository.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          PR_CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ] || [ -z "${SLACK_CHANNEL_ID:-}" ]; then
            echo "::notice::SLACK_PR_BOT_TOKEN / SLACK_PR_CHANNEL_ID not set (org or repo secret) — skipping the Slack post."
            exit 0
          fi
          # Build the Block Kit payload with jq so PR titles/branches that
          # contain quotes or other JSON-breaking characters are escaped
          # safely. Each button's value is itself a JSON object
          # ({"repo":"owner/repo","pr":N}) — Agent Zero parses that directly,
          # so it never has to regex the rendered Slack message to figure out
          # which PR a click was for.
          payload=$(jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg repo "$PR_REPO" \
            --arg repoFull "$PR_REPO_FULL" \
            --arg num "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            --arg base "$PR_BASE" \
            --arg head "$PR_HEAD" \
            --arg stats "+$PR_ADDITIONS / -$PR_DELETIONS · $PR_CHANGED files" \
            '{
              channel: $channel,
              text: ("New PR in " + $repo + " #" + $num + ": " + $title),
              blocks: [
                { type: "header",
                  text: { type: "plain_text", text: ("🔀 " + $repo + " · PR #" + $num) } },
                { type: "section",
                  text: { type: "mrkdwn",
                          text: ( "*<" + $url + "|" + $title + ">*\n"
                                + "by `" + $author + "`  •  `" + $head + "` → `" + $base + "`\n"
                                + $stats ) } },
                { type: "actions",
                  block_id: ("pr_" + $num),
                  elements: [
                    { type: "button", style: "primary", action_id: "pr_merge",
                      text: { type: "plain_text", text: "✅ Merge" },
                      value: ({ repo: $repoFull, pr: ($num | tonumber) } | tojson),
                      confirm: {
                        title:   { type: "plain_text", text: "Merge this PR?" },
                        text:    { type: "mrkdwn", text: ("Squash-merge *" + $repo + "* PR #" + $num + " into `" + $base + "` and delete `" + $head + "`.") },
                        confirm: { type: "plain_text", text: "Merge" },
                        deny:    { type: "plain_text", text: "Cancel" } } },
                    { type: "button", style: "danger", action_id: "pr_close",
                      text: { type: "plain_text", text: "🗑️ Close" },
                      value: ({ repo: $repoFull, pr: ($num | tonumber) } | tojson),
                      confirm: {
                        title:   { type: "plain_text", text: "Close this PR?" },
                        text:    { type: "mrkdwn", text: ("Close *" + $repo + "* PR #" + $num + " without merging.") },
                        confirm: { type: "plain_text", text: "Close" },
                        deny:    { type: "plain_text", text: "Cancel" } } }
                  ] }
              ]
            }')
          # chat.postMessage returns HTTP 200 even on a logical failure (e.g.
          # a channel Agent Zero isn't in), so the outcome is read from the
          # response body's `ok` field, not the HTTP status.
          response=$(curl -sS -X POST \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$payload" \
            https://slack.com/api/chat.postMessage)
          ok=$(echo "$response" | jq -r '.ok')
          if [ "$ok" != "true" ]; then
            echo "::error::Slack rejected the post: $response"
            exit 1
          fi
