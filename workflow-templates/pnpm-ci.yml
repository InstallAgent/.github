name: CI

# Standard Install Agent CI for pnpm + Biome + TypeScript repos.
# Mirrors team-web's pipeline: check → type-check → test → build.
# Steps use --if-present so repos without a given script still pass.

on:
  push:
    branches: [$default-branch]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node, so setup-node's pnpm cache works.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome (lint + format)
        run: pnpm run --if-present check

      - name: Type-check
        run: pnpm run --if-present type-check

      - name: Test
        run: pnpm run --if-present test

      - name: Build
        run: pnpm run --if-present build
        # If the build needs env vars (e.g. NextAuth), add throwaway
        # placeholders here — never real secrets. See team-web/ci.yml.
